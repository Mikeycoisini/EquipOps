# 显式使用 ops,redis-session；迁移默认关闭，部署前另行审批并执行。
server.port=${APP_PORT:8082}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
ops.log.directory=${OPS_LOG_DIRECTORY:logs}
management.server.address=127.0.0.1
management.server.port=${MANAGEMENT_PORT:9093}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
server.tomcat.accesslog.enabled=false
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.flywaydb=WARN
logging.level.com.zaxxer.hikari=WARN
