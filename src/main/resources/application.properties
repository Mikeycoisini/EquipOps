spring.application.name=EquipOpsV2
spring.profiles.default=redis-session

# Set these environment variables for a database you created explicitly.
# Flyway only creates/updates tables inside this configured schema.
server.port=${APP_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/equipops_v2?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
# 已手工执行过旧迁移、但无 flyway_schema_history 的库，首次启动自动 baseline
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
# 关闭 Hibernate 启动时打印的 Database info（JDBC URL、驱动、方言、池信息等）
logging.level.org.hibernate.orm.connections.pooling=WARN
# 本地联调：返回异常中的具体提示
spring.web.error.include-message=always



# V2.0 uses its own file root and browser session cookie.
inventory.export.root=${INVENTORY_EXPORT_ROOT:${user.home}/.equipops-v2/inventory-exports}

# A9 AI Agent; disabled by default so business modules are unaffected.
ai.enabled=${AI_ENABLED:false}
ai.base-url=${AI_BASE_URL:http://127.0.0.1:8090}
ai.shared-secret=${AI_SHARED_SECRET:}
ai.doc-root=${AI_DOC_ROOT:${user.home}/.equipops-v2/ai-documents}
ai.max-bytes=${AI_MAX_BYTES:5242880}
ai.task-timeout-ms=${AI_TASK_TIMEOUT_MS:60000}
ai.max-question-length=${AI_MAX_QUESTION_LENGTH:2000}
spring.servlet.multipart.max-file-size=${AI_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${AI_MAX_REQUEST_SIZE:10MB}
spring.session.data.redis.namespace=${REDIS_SESSION_NAMESPACE:equipops:v2:session}
server.servlet.session.cookie.name=EQUIPOPS_V2_SESSION
