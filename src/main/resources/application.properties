spring.application.name=EquipOpsV2
spring.profiles.default=redis-session

# Set these environment variables for a database you created explicitly.
# Flyway only creates/updates tables inside this configured schema.
server.port=${APP_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/equipops_v2?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
# 已手工执行过旧迁移、但无 flyway_schema_history 的库，首次启动自动 baseline
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
# 关闭 Hibernate 启动时打印的 Database info（JDBC URL、驱动、方言、池信息等）
logging.level.org.hibernate.orm.connections.pooling=WARN
# 本地联调：返回异常中的具体提示
spring.web.error.include-message=always



# V2.0 uses its own file root and browser session cookie.
inventory.export.root=${INVENTORY_EXPORT_ROOT:${user.home}/.equipops-v2/inventory-exports}
spring.session.data.redis.namespace=${REDIS_SESSION_NAMESPACE:equipops:v2:session}
server.servlet.session.cookie.name=EQUIPOPS_V2_SESSION
